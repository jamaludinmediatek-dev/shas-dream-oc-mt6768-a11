name: Build Kernel KSU Next
on:
  workflow_dispatch:
    inputs:
      device:
        description: "lancelot atau merlin"
        default: "merlin"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev zip device-tree-compiler curl git python2
          sudo apt-get install -y libtinfo5 || true
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Pasang KernelSU Next
        run: run: curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
      - name: Aktifkan config KSU
        run: |
          printf 'CONFIG_KSU=y\nCONFIG_KPROBES=y\nCONFIG_HAVE_KPROBES=y\nCONFIG_KPROBE_EVENTS=y\n' >> arch/arm64/configs/${{ inputs.device }}_defconfig

      - name: Download Proton Clang
        run: |
          mkdir -p clang-13
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-13/aaa

      - name: Build
        run: bash ./${{ inputs.device }}.sh

      - name: Cek hasil build
        run: test -f AnyKernel3-master/Image.gz-dtb

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.device }}-ksunext
          path: AnyKernel3-master/*.zip
