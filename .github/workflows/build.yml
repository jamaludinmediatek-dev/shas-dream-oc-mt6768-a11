name: Build Kernel Original
on:
  workflow_dispatch:
    inputs:
      device:
        description: "lancelot atau merlin"
        default: "merlin"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev zip device-tree-compiler curl git python2
          sudo apt-get install -y libtinfo5 || true
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Download Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-13/aaa

      - name: Build
        run: |
          bash ./${{ inputs.device }}.sh > build.log 2>&1 || true
          echo "=== RINGKASAN ERROR ==="
          grep -n -E "error:|\*\*\* \[|undefined reference" build.log | head -40 || true

      - name: Cek hasil build
        run: test -f AnyKernel3-master/Image.gz-dtb

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.device }}-original
          path: AnyKernel3-master/*.zip
